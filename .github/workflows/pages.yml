name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "forpages/**"
      - "fortauri/**"
      - "public/**"
      - "scripts/sync-pages.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fortauri/package-lock.json

      - name: Build static application
        run: |
          npm ci
          npm ci --prefix fortauri
          npm --prefix fortauri run build
          node scripts/sync-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./forpages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
